services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notacomforta_app
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    command: gunicorn notacomforta.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 300

  bot:
    build:
      context: .
    container_name: notacomforta_bot
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    command: python tg.py
    depends_on:
      - app

  nginx:
    image: nginx:latest
    container_name: nginx 
    ports:
      - "80:80"
      - "443:443"
    volumes: 
      - ./nginx.default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./static:/app/static
      - ./static:/app/staticfiles
      - ./media:/app/media
    env_file:
      - .env
    depends_on:
      - app