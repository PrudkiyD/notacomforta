<script>
    //Функції   

    function addUpdate() {
        let tools = document.querySelector('.object-tools')
        let html = `<li>
                        <a href="/update/" class='options-open'>
                            Оновити товар
                        </a>
                    </li>`
        tools.innerHTML = html + tools.innerHTML
    }

    function discount() {

        document.querySelector('.actions').innerHTML += `<input placeholder="Змінити ціни" name="discount" class="value-discount">
                                                            <button class="button add-discount" type="button">Застосувати</button>`

        const addDiscount = document.querySelector('.add-discount')

        addDiscount.addEventListener('click', function(){
            
            let discount = document.querySelector('.value-discount').value
            let result_list = document.querySelector('#result_list').querySelectorAll('#result_list input[type="checkbox"]');
            let product_list = []

            result_list.forEach(element => {
                if (element.checked){
                    product_list.push(element.value)
                    
                }
                
            });
            
            const csrf = "{{ csrf_token }}";
            fetch("/update/discount/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrf
                },
                body: JSON.stringify({ discount: discount,  product: product_list})
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error("Server error:\n" + text);
                    });
                }
                return response.json();
            })
            .then(data => {
                console.log("Response:", data);
                location.reload();
            })
            .catch(error => {
                console.error("Error:", error.message);
            });

            })
        

    }


</script>
<script>
    //Роутинг
    let url = window.location.pathname

    if (url == '/admin/catalog/product/') {
        addUpdate()
        discount()

    }
</script>
