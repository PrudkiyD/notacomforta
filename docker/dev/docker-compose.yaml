services:
  app:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: notacomforta_app
    volumes:
      - ../../:/app
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - ../../.env
    command: >
      gunicorn notacomforta.wsgi:application
      --bind 0.0.0.0:8000 --workers 3 --timeout 300
      
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ../../staticfiles:/app/staticfiles
      - ../../media:/app/media
      - ./nginx.default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app