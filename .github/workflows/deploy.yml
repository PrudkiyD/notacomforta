name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /var/www/notacomforta
            git pull origin main
            docker compose up -d --build
            docker exec notacomforta_app python manage.py migrate --noinput
            docker exec notacomforta_app python manage.py collectstatic --noinput